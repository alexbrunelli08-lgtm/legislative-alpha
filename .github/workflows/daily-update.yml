name: Daily data update

on:
  schedule:
    # Every 6 hours, so congressional disclosures stay current through the day.
    # Impact analysis is cached, so extra runs only re-fetch data, not re-pay for analysis.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # The whole-market screener price cache (~5.6k tickers) is too large to
      # commit to git, so it's persisted across runs via the Actions cache.
      - name: Restore screener price cache
        uses: actions/cache@v6
        with:
          path: screener_prices.json
          key: screener-prices-${{ github.run_id }}
          restore-keys: |
            screener-prices-

      - name: Run fetch script
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/fetch_data.py

      - name: Commit and push refreshed data if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json history.json prices.json sector_cache.json trades_cache.json insider_cache.json universe.json mcap_cache.json ratings_cache.json social_cache.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Data refresh: $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Anything pushed to main between checkout and here makes this a
          # non-fast-forward and killed the run. Only data files are touched,
          # so rebasing our refresh on top is always safe -- retry a few times
          # rather than losing a completed fetch to a race.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt) -- rebasing onto origin/main"
            git pull --rebase origin main || exit 1
            sleep 3
          done
          echo "push still failing after 3 attempts"
          exit 1

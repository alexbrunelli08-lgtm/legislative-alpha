name: Daily data update

on:
  schedule:
    # Every 6 hours, so congressional disclosures stay current through the day.
    # Impact analysis is cached, so extra runs only re-fetch data, not re-pay for analysis.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run fetch script
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/fetch_data.py

      - name: Commit and push refreshed data if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json history.json prices.json sector_cache.json trades_cache.json insider_cache.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Data refresh: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
